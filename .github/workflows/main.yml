name: RustDesk + Screenshot Upload (Windows)

on:
  workflow_dispatch:
    inputs:
      CODE:
        description: "Not used – kept for compatibility"
        required: false
        default: ""
      PIN:
        description: "RustDesk permanent password (6+ digits)"
        required: true
        default: "123456"

jobs:
  rustdesk:
    runs-on: windows-2022

    steps:
      - name: Show system info
        run: systeminfo

      # ----- Original tool installations (kept as requested) -----
      - name: Install 7-Zip, Python, and Go
        run: |
          Write-Host "Downloading installers..."
          Invoke-WebRequest "https://github.com/ip7z/7zip/releases/download/25.01/7z2501-x64.exe" -OutFile "7zip.exe"
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.2/python-3.12.2-amd64.exe" -OutFile "python.exe"
          Invoke-WebRequest "https://go.dev/dl/go1.22.5.windows-amd64.msi" -OutFile "go.msi"

          Write-Host "Installing..."
          Start-Process ".\7zip.exe" -ArgumentList "/S" -Wait
          Start-Process ".\python.exe" -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1" -Wait
          Start-Process "msiexec.exe" -ArgumentList "/i go.msi /quiet /norestart" -Wait

      - name: Install Python libraries (requests, pyautogui, pillow)
        run: |
          python -m pip install --upgrade pip
          pip install requests pyautogui pillow

      - name: Verify installations
        run: |
          python --version
          pip show requests pyautogui pillow
          go version

      # ----- RustDesk setup -----
      - name: Download RustDesk MSI
        run: |
          Write-Host "Downloading RustDesk installer..."
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-x86_64.msi" -OutFile "rustdesk.msi"

      - name: Install RustDesk silently
        run: |
          Start-Process msiexec.exe -ArgumentList '/i rustdesk.msi /quiet /norestart' -Wait

      - name: Start RustDesk with permanent password
        run: |
          $pin = "${{ github.event.inputs.PIN }}"
          $rustDeskExe = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          Write-Host "Launching RustDesk..."
          Start-Process -FilePath $rustDeskExe -ArgumentList "--password", $pin

      - name: Wait for RustDesk window to appear
        run: Start-Sleep -Seconds 4

      # ----- NEW: Bring RustDesk window to the front (like clicking the taskbar icon) -----
      - name: Activate RustDesk window
        run: |
          $process = Get-Process -Name rustdesk -ErrorAction SilentlyContinue | Select -First 1
          if ($process) {
              Add-Type @"
              using System;
              using System.Runtime.InteropServices;
              public class Win32Window {
                  [DllImport("user32.dll")]
                  public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);
                  [DllImport("user32.dll")]
                  public static extern bool SetForegroundWindow(IntPtr hWnd);
              }
"@
              # Restore the window if minimized (SW_RESTORE = 9)
              [Win32Window]::ShowWindowAsync($process.MainWindowHandle, 9)
              Start-Sleep -Milliseconds 500
              # Bring it to the foreground
              [Win32Window]::SetForegroundWindow($process.MainWindowHandle)
              Start-Sleep -Seconds 1
              Write-Host "RustDesk window activated."
          } else {
              Write-Host "RustDesk process not found – continuing anyway."
          }

      # ----- Screenshot and upload -----
      - name: Take screenshot, upload, and print URL
        run: |
          @"
          import pyautogui
          import requests
          print("Taking screenshot...")
          pyautogui.screenshot("photo.jpg")
          print("Uploading...")
          r = requests.post("http://157.250.198.96:8080/upload.php", files={"file": open("photo.jpg", "rb")})
          url = r.text.strip()
          print(f"Direct image URL: {url}")
          "@ | python

      # ----- Keep alive (6 hours) -----
      - name: Keep machine alive with timer (6 hours)
        run: |
          Write-Host "Machine ready. Screenshot uploaded – use the URL above to see RustDesk credentials."
          $totalMinutes = 360
          $interval = 30
          for ($elapsed = 0; $elapsed -lt $totalMinutes; $elapsed += $interval) {
              $remaining = $totalMinutes - $elapsed
              Write-Host "Machine time remaining: $remaining minutes"
              Start-Sleep -Seconds ($interval * 60)
          }
          Write-Host "Session time completed."
